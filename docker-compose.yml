services:
  compute:
    build: ./compute
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    build: ./api
    ports:
      - "5080:8080"
    environment:
      ComputeService__BaseUrl: "http://compute:8000"
      Cors__AllowedOrigin: "http://localhost:5090"
    depends_on:
      compute:
        condition: service_healthy